workflows:
  ios-workflow:
    name: Kart House iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app